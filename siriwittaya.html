<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองสถานที่ - อาคารสิริวิทยา</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>แบบฟอร์มขอใช้สถานที่</h1>
        <h2>อาคารสิริวิทยา</h2>
        <form id="bookingForm">
            <input type="hidden" id="building" name="building" value="อาคารสิริวิทยา">
            
            <div class="form-group">
                <label for="requester">ชื่อผู้ขอใช้ / หน่วยงาน</label>
                <input type="text" id="requester" name="requester" required placeholder="เช่น กองกิจการนักศึกษา">
            </div>
            
            <div class="form-group">
                <label for="userType">ประเภทผู้ใช้งาน</label>
                <select id="userType" name="userType" required>
                    <option value="">-- เลือกประเภท --</option>
                    <option value="นักศึกษา">นักศึกษา</option>
                    <option value="ส่วนงาน">ส่วนงานภายใน</option>
                    <option value="บุคคลภายนอก">บุคคลภายนอก</option>
                </select>
            </div>

            <div class="form-group">
                <label for="eventName">ชื่องาน / กิจกรรม</label>
                <input type="text" id="eventName" name="eventName" required>
            </div>

            <div class="form-group">
                <label for="room">สถานที่ / ห้อง</label>
                <select id="room" name="room" required>
                    <option value="">-- เลือกห้อง --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="eventDate">วันที่จัดงาน</label>
                <input type="date" id="eventDate" name="eventDate" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="startTime">เวลาเริ่ม</label>
                    <input type="time" id="startTime" name="startTime" required>
                </div>
                <div class="form-group">
                    <label for="endTime">เวลาสิ้นสุด</label>
                    <input type="time" id="endTime" name="endTime" required>
                </div>
            </div>

            <div class="form-group">
                <label for="pax">จำนวนคน</label>
                <input type="number" id="pax" name="pax" required min="1">
            </div>
            
            <div class="form-group">
                <label for="remarks">หมายเหตุ (ถ้ามี)</label>
                <textarea id="remarks" name="remarks" rows="3"></textarea>
            </div>

            <button type="submit" class="btn">ส่งคำขอจองสถานที่</button>
            <div id="loader" class="loader">กำลังส่งข้อมูล...</div>
        </form>
        <a href="index.html" class="btn btn-back">กลับหน้าหลัก</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/config.js"></script>
    <script src="js/siriwittaya.js"></script>
</body>
</html>
