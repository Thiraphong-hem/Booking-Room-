<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก - ระบบจองสถานที่</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="https://mahidol.ac.th/temp/2019/06/logo-mahidol.png" alt="Mahidol Logo">
        </div>
        <h1>ระบบจองสถานที่และห้องประชุม</h1>
        <h2>มหาวิทยาลัยมหิดล</h2>
        <p class="text-center">กรุณาเลือกอาคารที่ท่านต้องการใช้บริการ</p>
        
        <a href="siriwittaya.html" class="btn">อาคารสิริวิทยา</a>
        <a href="learning_center.html" class="btn">ศูนย์การเรียนรู้มหิดล (MLC)</a>
        <a href="prince_mahidol_hall.html" class="btn">มหิดลสิทธาคาร</a>

        <!-- ================= แถบเมนูด้านบน ================= -->
        <div class="top-actions" style="display: flex; gap: 15px; margin-top: 25px; margin-bottom: 25px; flex-wrap: wrap; align-items: center; justify-content: center; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
            
            <!-- ปุ่มซ่อน/แสดงปฏิทิน -->
            <button id="btnToggleCalendar" class="btn" style="background-color: #007bff; margin: 0; display: flex; align-items: center; gap: 8px; width: auto;">
                📅 <span>ดูปฏิทินการจอง</span>
            </button>
            
            <!-- ส่วนพิมพ์เอกสาร PDF (ย้ายมาไว้ด้านบน) -->
            <div class="print-inline" style="display: flex; gap: 10px; align-items: center; border-left: 2px solid #ccc; padding-left: 15px;">
                <label for="printDate" style="margin: 0; font-weight: bold; color: var(--primary-color);">🖨️ พิมพ์ฟอร์ม:</label>
                <input type="date" id="printDate" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: auto;">
                <button id="btnPrintByDate" class="btn" style="margin: 0; background-color: #28a745; padding: 6px 15px; width: auto;">สร้าง PDF</button>
            </div>
            
        </div>
        <!-- =============================================== -->

        <!-- ส่วนของปฏิทินที่เพิ่มเข้ามา (ซ่อนไว้เป็นค่าเริ่มต้นโดยใช้ style="display: none;") -->
        <div class="calendar-container" id="calendarSection" style="display: none;">
            <div class="calendar-header">
                <button id="prevMonth">&lt;</button>
                <h3 id="monthYear"></h3>
                <button id="nextMonth">&gt;</button>
            </div>
            <div class="calendar-days">
                <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
            </div>
            <div class="calendar-dates" id="calendarDates"></div>
        </div>
        <!-- สิ้นสุดส่วนของปฏิทิน -->

    </div>
    
    <script src="js/config.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
